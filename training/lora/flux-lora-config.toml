# ============================================
# 🏆 Professional LoRA Training Config - Flux.1
# ============================================

[model_arguments]
pretrained_model_name_or_path = "/workspace/ComfyUI/models/unet/flux1-dev.safetensors"
vae = "/workspace/ComfyUI/models/vae/ae.safetensors"
v2 = false
v_parameterization = false

[dataset_arguments]
train_data_dir = "/workspace/training/input"
resolution = "1024,1024"
enable_bucket = true
min_bucket_reso = 768
max_bucket_reso = 1536
bucket_reso_steps = 64
caption_extension = ".txt"
shuffle_caption = true
keep_tokens = 2
flip_aug = true
color_aug = false

[training_arguments]
# Output
output_dir = "/workspace/training/output"
output_name = "flux_lora"
save_model_as = "safetensors"
save_precision = "bf16"

# Network (LoRA)
network_module = "lycoris.kohya"
network_dim = 128
network_alpha = 64
network_args = [
    "conv_dim=128",
    "conv_alpha=64",
    "algo=locon",
    "dropout=0.1"
]

# Optimizer
optimizer_type = "AdamW8bit"
learning_rate = 0.0001
lr_scheduler = "cosine_with_restarts"
lr_warmup_steps = 100
lr_scheduler_num_cycles = 3

# Training
max_train_steps = 2500
train_batch_size = 1
gradient_accumulation_steps = 4
gradient_checkpointing = true
mixed_precision = "bf16"
xformers = true

# Memory
cache_latents = true
cache_latents_to_disk = true
vae_batch_size = 1

# Quality
noise_offset = 0.05
adaptive_noise_scale = 0.00357
multires_noise_iterations = 8
multires_noise_discount = 0.3
min_snr_gamma = 5.0

# Checkpoints
save_every_n_steps = 250
save_state = true

# Logging
logging_dir = "/workspace/training/logs"
log_with = "tensorboard"

# Samples
sample_every_n_steps = 250
sample_prompts = "/workspace/training/prompts.txt"
sample_sampler = "euler_a"

[optimizer_arguments]
weight_decay = 0.01
betas = [0.9, 0.999]
